name: Daily project sync

on:
  schedule:
    # 02:00 UTC is 07:30 in India (IST, UTC+5:30)
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Tokens Wallet
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Copy selected project files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/agent-wallet-sdk
          git clone --depth 1 https://github.com/up2itnow0822/agent-wallet-sdk.git /tmp/agent-wallet-sdk
          rm -rf synced
          mkdir -p synced/src/tokens
          cp /tmp/agent-wallet-sdk/package.json synced/package.json
          cp /tmp/agent-wallet-sdk/LICENSE synced/LICENSE
          cp /tmp/agent-wallet-sdk/src/tokens/index.ts synced/src/tokens/index.ts
          cp /tmp/agent-wallet-sdk/src/tokens/registry.ts synced/src/tokens/registry.ts
          cp /tmp/agent-wallet-sdk/src/tokens/transfers.ts synced/src/tokens/transfers.ts
          cp /tmp/agent-wallet-sdk/src/tokens/solana.ts synced/src/tokens/solana.ts
          cp /tmp/agent-wallet-sdk/src/tokens/decimals.ts synced/src/tokens/decimals.ts
          date_stamp="$(TZ=Asia/Kolkata date +%Y-%m-%d)"
          line="${date_stamp} synced package.json, LICENSE, and src/tokens from agent-wallet-sdk"
          touch sync-log.txt
          if ! grep -qxF "$line" sync-log.txt; then
            printf '%s\n' "$line" >> sync-log.txt
          fi

      - name: Commit and push
        shell: bash
        env:
          AUTHOR_NAME: Avinash Singh
          AUTHOR_EMAIL: 356221064+avinashsinghtech@users.noreply.github.com
        run: |
          set -euo pipefail
          git -c user.name="$AUTHOR_NAME" -c user.email="$AUTHOR_EMAIL" add synced sync-log.txt
          if git diff --cached --quiet; then
            echo "Today's sync is already committed."
            exit 0
          fi
          date_stamp="$(TZ=Asia/Kolkata date +%Y-%m-%d)"
          git -c user.name="$AUTHOR_NAME" -c user.email="$AUTHOR_EMAIL" commit -m "Sync project files for ${date_stamp}"
          git push
