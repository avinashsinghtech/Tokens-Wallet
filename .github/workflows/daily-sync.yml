name: Daily project sync

on:
  schedule:
    # 02:00 UTC is 07:30 in India (IST, UTC+5:30)
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Tokens Wallet
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Copy the next project file
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/agent-wallet-sdk
          git clone --depth 1 https://github.com/up2itnow0822/agent-wallet-sdk.git /tmp/agent-wallet-sdk
          next=""
          while IFS= read -r path; do
            case "$path" in
              .env|*/.env) continue ;;
            esac
            if [ ! -f "synced/$path" ]; then
              next="$path"
              break
            fi
          done < <(git -C /tmp/agent-wallet-sdk ls-files | LC_ALL=C sort)
          if [ -z "$next" ]; then
            echo "Every project file is already in synced/."
            exit 0
          fi
          mkdir -p "synced/$(dirname "$next")"
          cp "/tmp/agent-wallet-sdk/$next" "synced/$next"
          date_stamp="$(TZ=Asia/Kolkata date +%Y-%m-%d)"
          printf '%s %s\n' "$date_stamp" "$next" >> sync-log.txt
          printf '%s\n' "$next" > /tmp/next-file.txt

      - name: Commit and push
        shell: bash
        env:
          AUTHOR_NAME: Avinash Singh
          AUTHOR_EMAIL: 356221064+avinashsinghtech@users.noreply.github.com
        run: |
          set -euo pipefail
          if [ ! -f /tmp/next-file.txt ]; then
            echo "No new file to commit."
            exit 0
          fi
          next="$(cat /tmp/next-file.txt)"
          git -c user.name="$AUTHOR_NAME" -c user.email="$AUTHOR_EMAIL" add synced sync-log.txt
          if git diff --cached --quiet; then
            echo "Today's file is already committed."
            exit 0
          fi
          date_stamp="$(TZ=Asia/Kolkata date +%Y-%m-%d)"
          git -c user.name="$AUTHOR_NAME" -c user.email="$AUTHOR_EMAIL" commit -m "Add ${next} for ${date_stamp}"
          git push
